[package]
name = "rustvision"
version = "0.1.0"
edition = "2021"
description = "A convolutional neural network built from scratch in pure Rust, running live in the browser via WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3
